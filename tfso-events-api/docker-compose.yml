services:
  # ---------- СУБД ----------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tfso
      POSTGRES_PASSWORD: tfso
      POSTGRES_DB: tfso_events
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfso -d tfso_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Микросервис ----------
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tfso:tfso@db:5432/tfso_events
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
