services:
  db:
    image: postgres:16-alpine
    container_name: tfso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tfso
      POSTGRES_PASSWORD: tfso
      POSTGRES_DB: tfso_events
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfso -d tfso_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./tfso-events-api
    container_name: tfso-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://tfso:tfso@db:5432/tfso_events
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "4000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./tfso-site
    container_name: tfso-web
    restart: unless-stopped
    environment:
      EVENTS_API_URL: http://api:3000
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
