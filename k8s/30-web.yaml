apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tfso
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: tfso-site:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: EVENTS_API_URL
              value: http://api:3000
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tfso
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
